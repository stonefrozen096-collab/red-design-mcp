name: Publish

# Publishes to npm when you create a GitHub release.
# One-time setup: add an npm access token with publish rights as the repository secret NPM_TOKEN.
# --provenance needs the "repository" field in package.json to match this GitHub repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

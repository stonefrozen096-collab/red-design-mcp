  <rect x="126" y="262" width="58" height="30" rx="15" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-opacity="0.7" stroke-width="1"/>
  <text x="155" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffb3c1" text-anchor="middle">URL</text>
  <rect x="192" y="262" width="58" height="30" rx="15" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-opacity="0.7" stroke-width="1"/>
  <text x="221" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffb3c1" text-anchor="middle">CSS</text>
  <rect x="352" y="150" width="272" height="190" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="376" y="192" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Your AI tool</text>
  <text x="376" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffb3c1">Claude Code · Codex</text>
  <text x="376" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffb3c1">Cursor · others</text>
  <text x="376" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa0b4">Picks the tools it needs</text>
  <text x="376" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa0b4">for the job</text>
  <rect x="744" y="70" width="424" height="370" rx="22" fill="#e11d48" fill-opacity="0.07" stroke="#e11d48" stroke-opacity="0.9" stroke-width="2"/>
  <text x="768" y="112" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">red-design-mcp</text>
  <text x="768" y="136" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffb3c1">MCP server  ·  31 tools</text>
  <rect x="768" y="160" width="176" height="200" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>

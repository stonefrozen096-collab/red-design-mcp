  <circle cx="312" cy="245" r="14" fill="#e11d48"/>
  <text x="312" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="624" y1="215" x2="732" y2="215" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="744.0,215.0 731.4,207.8 731.4,222.2" fill="#e11d48"/>
  <text x="684" y="190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa0b4" text-anchor="middle">tool call</text>
  <circle cx="684" cy="215" r="14" fill="#e11d48"/>
  <text x="684" y="220" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="744" y1="290" x2="636" y2="290" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="624.0,290.0 636.6,282.8 636.6,297.2" fill="#e11d48"/>
  <text x="684" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa0b4" text-anchor="middle">result</text>
  <circle cx="684" cy="290" r="14" fill="#e11d48"/>
  <text x="684" y="295" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="488" y1="340" x2="488" y2="428" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <polygon points="488.0,440.0 480.8,427.4 495.2,427.4" fill="#ffffff"/>
  <text x="512" y="395" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa0b4">deliver</text>
  <circle cx="488" cy="390" r="14" fill="#e11d48"/>
  <text x="488" y="395" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <line x1="856" y1="360" x2="856" y2="476" stroke="#ffb3c1" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="856.0,488.0 848.8,475.4 863.2,475.4" fill="#ffb3c1"/>
  <text x="872" y="410" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffb3c1">optional: API-key mode</text>
  <text x="600" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0b4" text-anchor="middle">Host mode (default): vision tools hand the image and instructions back to your AI tool, so no API key is needed.</text>
</svg>

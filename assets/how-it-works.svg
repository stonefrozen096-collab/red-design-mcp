<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="How red-design-mcp works: you share a design with your AI tool, which calls vision or exact tools in the red-design-mcp server and delivers code, tokens and reports." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How red-design-mcp works</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a0f"/><stop offset="1" stop-color="#1c0a13"/></linearGradient></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="40" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffb3c1" letter-spacing="2">HOW IT WORKS</text>
  <rect x="40" y="170" width="232" height="150" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
  <text x="60" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Your design</text>
  <text x="60" y="234" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa0b4">Share any of these</text>
  <rect x="60" y="262" width="58" height="30" rx="15" fill="#e11d48" fill-opacity="0.18" stroke="#e11d48" stroke-opacity="0.7" stroke-width="1"/>

  <text x="376" y="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Code, tokens, reports</text>
  <text x="376" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa0b4">Ready for your project</text>
  <rect x="768" y="488" width="272" height="60" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="788" y="515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Anthropic or OpenAI</text>
  <text x="788" y="536" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa0b4">A vision model</text>
